<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cosmic Home">
  <meta name="description" content="Cosmic Home: Math Adventure. Explore the stars, grow with your companion, and find your way home.">
  <meta name="theme-color" content="#1a1a2e">
  <title>Cosmic Home: Math Adventure</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: "Cosmic Lilita";
      src: url('/fonts/LilitaOne-Regular.ttf') format('truetype');
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Cosmic Fredoka";
      src: url('/fonts/Fredoka-Variable.ttf') format('truetype');
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic viewport height for mobile */
      background: #12121f;
      overflow: hidden;
      touch-action: none;
      -webkit-overflow-scrolling: touch;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      /* Extend into iOS safe-area (notch / home indicator) so the canvas fills
         the whole screen instead of leaving a status-bar-height gap. */
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
      padding-left: env(safe-area-inset-left, 0);
      padding-right: env(safe-area-inset-right, 0);
    }
    /* When installed as a PWA, ignore safe-area padding and let the canvas
       fill edge-to-edge. Phaser scales it to fit and centers it itself, so
       any inset at the top reads as a blank band. */
    @media (display-mode: standalone) {
      body {
        padding: 0;
      }
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-height: 100dvh;
      position: relative;
    }
    #game-container canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      /* Phaser owns canvas sizing and centering inside the available area. */
    }
    /* iOS 26 Home Screen apps report a viewport that is short by the
       status bar (100dvh and innerHeight leave it out) while still drawing
       the page from the very top of the screen, so the game rides up under
       the clock and leaves a blank band at the bottom. In a Home Screen app
       the large viewport unit is the real full screen, and it matches the
       other units wherever that bug is absent. Keep this after the rules
       above so it wins. */
    @media (display-mode: standalone) {
      html, body {
        height: 100vh;
        height: 100lvh;
      }
      #game-container {
        max-height: none;
      }
    }
    #boot-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #cfcfe0;
      font: 20px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="game-container"><p id="boot-loading" role="status">Loading…</p></div>
  <script>
    // Backstop for the same iOS 26 bug on phones where even the CSS above
    // comes out short: in a full-screen Home Screen app held upright, a page
    // short of the screen by about a status bar is sized to the whole screen.
    // Split-screen and sideways windows are narrower than screen.width and
    // are left alone.
    (function () {
      var standalone = navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (!standalone) return;
      var root = document.documentElement, body = document.body;
      function fit() {
        root.style.height = body.style.height = '';
        var gap = screen.height - body.getBoundingClientRect().height;
        if (window.innerWidth === screen.width && gap > 0 && gap <= 80) {
          root.style.height = body.style.height = screen.height + 'px';
        }
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
